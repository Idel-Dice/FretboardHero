<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baritone Uke Academy</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-success: #22c55e;
      --accent-warn: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --pink: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 2.2rem; color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover { background: var(--accent); color: #000; }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Song & Game Selection */
    .selector-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    select {
      background: #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      font-size: 1rem;
      font-weight: bold;
    }

    /* Target Display */
    .target-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid var(--accent);
    }
    .big-note { font-size: 3.5rem; font-weight: bold; color: var(--pink); }
    .note-instruction { font-size: 1.2rem; color: var(--text-main); margin-top: 5px; }
    .score-badge { font-size: 1.2rem; font-weight: bold; color: var(--accent-success); margin-top: 10px; }

    /* Visual Fretboard */
    .fretboard {
      display: flex;
      flex-direction: column;
      background: #451a03;
      border: 4px solid #78350f;
      border-radius: 8px;
      padding: 10px 0;
      position: relative;
    }
    .string-label {
      position: absolute;
      left: -35px;
      color: var(--accent);
      font-weight: bold;
      font-size: 0.9rem;
    }
    .string-row {
      display: flex;
      height: 36px;
      align-items: center;
      position: relative;
    }
    .string-line {
      position: absolute;
      width: 100%;
      background: #cbd5e1;
      z-index: 1;
    }
    .fret {
      flex: 1;
      height: 100%;
      border-right: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      position: relative;
    }
    .fret-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-success);
      color: #000;
      font-weight: bold;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--accent-success);
    }
    .fret-dot.active { display: flex; }

    .pulse-success {
      animation: pulse 0.5s ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); border-color: var(--accent-success); }
      100% { transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Baritone Uke Academy 🎶</h1>
    <p class="subtitle">Play songs & games on your D-G-B-E Baritone Ukulele!</p>
  </header>

  <nav>
    <button class="btn active" onclick="switchMode('song')">🎵 Song Practice</button>
    <button class="btn" onclick="switchMode('ninja')">🥷 String Ninja Game</button>
  </nav>

  <div class="container">
    
    <!-- SONG MODE -->
    <div id="song-view">
      <div class="selector-bar">
        <label for="song-select" style="font-weight:bold;">Choose a Song:</label>
        <select id="song-select" onchange="loadSong()">
          <option value="hotcross">Hot Cross Buns (Easy)</option>
          <option value="babyshark">Baby Shark (Fun)</option>
          <option value="twinkle">Twinkle Twinkle Little Star</option>
        </select>
        <button id="mic-btn" class="btn" onclick="toggleMic()">🎤 Start Mic Listener</button>
      </div>

      <div class="target-card" id="target-card">
        <div class="big-note" id="target-note">B3</div>
        <div class="note-instruction" id="target-inst">Play 2nd Fret on G String</div>
        <div class="score-badge" id="song-progress">Note 1 of 3</div>
      </div>
    </div>

    <!-- NINJA GAME MODE -->
    <div id="ninja-view" class="hidden">
      <div class="selector-bar">
        <h3>Pluck the correct open string when called!</h3>
        <button class="btn" onclick="toggleMic()">🎤 Start Game Mic</button>
      </div>
      <div class="target-card">
        <div class="big-note" id="ninja-target">G3</div>
        <div class="note-instruction">Pluck the open 3rd String (G)</div>
        <div class="score-badge" id="ninja-score">Score: 0 ⭐</div>
      </div>
    </div>

    <!-- FRETBOARD VISUALIZER GUIDE -->
    <h4 style="margin: 15px 0 8px 0; color: var(--text-muted);">Finger Placement Guide:</h4>
    <div class="fretboard">
      <!-- E4 String -->
      <div class="string-row">
        <span class="string-label">E4</span>
        <div class="string-line" style="height:1px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-3-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-3">3</div></div>
      </div>
      <!-- B3 String -->
      <div class="string-row">
        <span class="string-label">B3</span>
        <div class="string-line" style="height:1.5px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-2-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-3">3</div></div>
      </div>
      <!-- G3 String -->
      <div class="string-row">
        <span class="string-label">G3</span>
        <div class="string-line" style="height:2px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-1-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-3">3</div></div>
      </div>
      <!-- D3 String -->
      <div class="string-row">
        <span class="string-label">D3</span>
        <div class="string-line" style="height:2.5px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-0-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-3">3</div></div>
      </div>
    </div>

  </div>

  <script>
    const SONGS = {
      hotcross: [
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Pluck Open 2nd String (B)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: 'Fret 2nd Fret on 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Pluck Open 3rd String (G)' }
      ],
      babyshark: [
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Pluck Open 4th String (D)' },
        { note: 'E3', freq: 164.81, stringIdx: 0, fret: 2, inst: 'Fret 2nd Fret on 4th String (D)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Pluck Open 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Pluck Open 3rd String (G)' }
      ],
      twinkle: [
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' }
      ]
    };

    let currentMode = 'song';
    let currentSong = [];
    let songStep = 0;
    let ninjaScore = 0;
    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let cooldown = false;

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('nav .btn').forEach((b, i) => b.classList.toggle('active', (i===0 && mode==='song') || (i===1 && mode==='ninja')));
      document.getElementById('song-view').classList.toggle('hidden', mode !== 'song');
      document.getElementById('ninja-view').classList.toggle('hidden', mode !== 'ninja');
      
      if(mode === 'song') loadSong();
      else startNinjaRound();
    }

    function loadSong() {
      const key = document.getElementById('song-select').value;
      currentSong = SONGS[key];
      songStep = 0;
      updateSongUI();
    }

    function updateSongUI() {
      const item = currentSong[songStep];
      document.getElementById('target-note').innerText = item.note;
      document.getElementById('target-inst').innerText = item.inst;
      document.getElementById('song-progress').innerText = `Note ${songStep + 1} of ${currentSong.length}`;
      highlightFret(item.stringIdx, item.fret);
    }

    function startNinjaRound() {
      const strings = [
        { note: 'D3', freq: 146.83, s: 0, inst: 'Pluck Open 4th String (D)' },
        { note: 'G3', freq: 196.00, s: 1, inst: 'Pluck Open 3rd String (G)' },
        { note: 'B3', freq: 246.94, s: 2, inst: 'Pluck Open 2nd String (B)' },
        { note: 'E4', freq: 329.63, s: 3, inst: 'Pluck Open 1st String (E)' }
      ];
      const target = strings[Math.floor(Math.random() * strings.length)];
      window.ninjaTarget = target;
      document.getElementById('ninja-target').innerText = target.note;
      highlightFret(target.s, 0);
    }

    function highlightFret(stringIdx, fretIdx) {
      document.querySelectorAll('.fret-dot').forEach(d => d.classList.remove('active'));
      const dot = document.getElementById(`dot-${stringIdx}-${fretIdx}`);
      if(dot) dot.classList.add('active');
    }

    async function toggleMic() {
      if(isListening) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      isListening = true;
      document.querySelectorAll('#mic-btn').forEach(b => b.innerText = "🎤 Listening...");
      listen();
    }

    function listen() {
      if(!isListening) return;
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

      if(pitch !== -1 && !cooldown) {
        let targetFreq = currentMode === 'song' ? currentSong[songStep].freq : window.ninjaTarget.freq;
        
        if(Math.abs(pitch - targetFreq) < 6.0) { // Tolerant threshold for kids
          cooldown = true;
          document.getElementById('target-card').classList.add('pulse-success');
          
          setTimeout(() => {
            document.getElementById('target-card').classList.remove('pulse-success');
            if(currentMode === 'song') {
              songStep = (songStep + 1) % currentSong.length;
              updateSongUI();
            } else {
              ninjaScore += 1;
              document.getElementById('ninja-score').innerText = `Score: ${ninjaScore} ⭐`;
              startNinjaRound();
            }
            cooldown = false;
          }, 600);
        }
      }
      requestAnimationFrame(listen);
    }

    function autoCorrelate(buf, sr) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.015) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++)
        for (let j = 0; j < SIZE - i; j++)
          c[i] = c[i] + buf[j] * buf[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      return sr / maxpos;
    }

    loadSong();
  </script>
</body>
</html>
