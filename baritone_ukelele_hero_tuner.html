<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baritone Ukulele Hero</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-success: #22c55e;
      --accent-warn: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 2.2rem; color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }

    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover { background: var(--accent); color: #000; }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Tuner View */
    .tuner-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .string-selector {
      display: flex;
      gap: 15px;
    }
    .string-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }
    .string-btn.active {
      background: var(--accent);
      color: #000;
    }

    .gauge-wrapper {
      position: relative;
      width: 300px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gauge-arc {
      width: 280px;
      height: 140px;
      border: 8px solid #334155;
      border-bottom: none;
      border-radius: 140px 140px 0 0;
      position: relative;
      overflow: hidden;
    }
    .needle {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 120px;
      background: #ef4444;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.1s ease-out;
    }
    .readout {
      margin-top: 15px;
      text-align: center;
    }
    .note-display { font-size: 3rem; font-weight: bold; }
    .freq-display { color: var(--text-muted); font-size: 1.1rem; }
    .status-badge {
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      background: #334155;
    }
    .status-badge.in-tune { background: var(--accent-success); color: #000; }

    /* Fretboard Visualizer */
    .fretboard {
      display: flex;
      flex-direction: column;
      background: #451a03;
      border: 4px solid #78350f;
      border-radius: 8px;
      padding: 10px 0;
      margin-top: 20px;
      position: relative;
    }
    .string-row {
      display: flex;
      height: 32px;
      align-items: center;
      position: relative;
    }
    .string-line {
      position: absolute;
      width: 100%;
      background: #cbd5e1;
      z-index: 1;
    }
    .fret {
      flex: 1;
      height: 100%;
      border-right: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      position: relative;
    }
    .fret-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-success);
      display: none;
    }
    .fret-dot.active { display: block; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Baritone Ukulele Hero</h1>
    <p class="subtitle">Tuned to D3 - G3 - B3 - E4</p>
  </header>

  <nav>
    <button class="btn active" onclick="switchMode('tuner')">Tuner Mode</button>
    <button class="btn" onclick="switchMode('play')">Interactive Practice</button>
  </nav>

  <div class="container">
    <!-- TUNER SECTION -->
    <div id="tuner-view" class="tuner-card">
      <div class="string-selector">
        <button class="string-btn" onclick="selectString(0)">D3</button>
        <button class="string-btn" onclick="selectString(1)">G3</button>
        <button class="string-btn" onclick="selectString(2)">B3</button>
        <button class="string-btn" onclick="selectString(3)">E4</button>
      </div>

      <div class="gauge-wrapper">
        <div class="gauge-arc">
          <div id="needle" class="needle"></div>
        </div>
      </div>

      <div class="readout">
        <div id="note-name" class="note-display">--</div>
        <div id="freq-val" class="freq-display">0.0 Hz</div>
        <div id="tune-status" class="status-badge">Select String or Play</div>
      </div>

      <button id="mic-btn" class="btn" onclick="toggleMic()">Start Microphone</button>
    </div>

    <!-- PRACTICE SECTION -->
    <div id="play-view" class="hidden">
      <h3 style="text-align: center; margin-bottom: 15px;">Target Note: <span id="target-note" style="color:var(--accent);">D3 (Open 4th String)</span></h3>
      
      <!-- Fretboard View -->
      <div class="fretboard">
        <!-- E4 String -->
        <div class="string-row">
          <div class="string-line" style="height:1px;"></div>
          <div class="fret"><div class="fret-dot" id="dot-3-0"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-3-1"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-3-2"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-3-3"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-3-4"></div></div>
        </div>
        <!-- B3 String -->
        <div class="string-row">
          <div class="string-line" style="height:1.5px;"></div>
          <div class="fret"><div class="fret-dot" id="dot-2-0"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-2-1"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-2-2"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-2-3"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-2-4"></div></div>
        </div>
        <!-- G3 String -->
        <div class="string-row">
          <div class="string-line" style="height:2px;"></div>
          <div class="fret"><div class="fret-dot" id="dot-1-0"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-1-1"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-1-2"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-1-3"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-1-4"></div></div>
        </div>
        <!-- D3 String -->
        <div class="string-row">
          <div class="string-line" style="height:2.5px;"></div>
          <div class="fret"><div class="fret-dot" id="dot-0-0"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-0-1"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-0-2"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-0-3"></div></div>
          <div class="fret"><div class="fret-dot" id="dot-0-4"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STRINGS = [
      { note: 'D3', freq: 146.83 },
      { note: 'G3', freq: 196.00 },
      { note: 'B3', freq: 246.94 },
      { note: 'E4', freq: 329.63 }
    ];

    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let selectedStringIdx = 0;

    function switchMode(mode) {
      document.querySelectorAll('nav .btn').forEach(b => b.classList.remove('active'));
      if(mode === 'tuner') {
        document.querySelectorAll('nav .btn')[0].classList.add('active');
        document.getElementById('tuner-view').classList.remove('hidden');
        document.getElementById('play-view').classList.add('hidden');
      } else {
        document.querySelectorAll('nav .btn')[1].classList.add('active');
        document.getElementById('tuner-view').classList.add('hidden');
        document.getElementById('play-view').classList.remove('hidden');
      }
    }

    function selectString(idx) {
      selectedStringIdx = idx;
      document.querySelectorAll('.string-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });
      document.getElementById('note-name').innerText = STRINGS[idx].note;
    }

    async function toggleMic() {
      if(isListening) { isListening = false; return; }
      
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      isListening = true;
      document.getElementById('mic-btn').innerText = "Stop Microphone";
      processAudio();
    }

    function processAudio() {
      if(!isListening) return;
      
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);
      if(pitch !== -1) {
        document.getElementById('freq-val').innerText = pitch.toFixed(1) + ' Hz';
        const targetFreq = STRINGS[selectedStringIdx].freq;
        const diff = pitch - targetFreq;
        
        // Needle angle calculation (-45 deg to 45 deg)
        const angle = Math.max(-45, Math.min(45, diff * 3));
        document.getElementById('needle').style.transform = `translateX(-50%) rotate(${angle}deg)`;
        
        const status = document.getElementById('tune-status');
        if(Math.abs(diff) < 1.5) {
          status.innerText = "In Tune!";
          status.className = "status-badge in-tune";
        } else if(diff < 0) {
          status.innerText = "Too Low (Tune Up)";
          status.className = "status-badge";
        } else {
          status.innerText = "Too High (Tune Down)";
          status.className = "status-badge";
        }
      }
      
      requestAnimationFrame(processAudio);
    }

    // Basic autocorrelation algorithm calibrated for 100 Hz - 700 Hz
    function autoCorrelate(buf, sr) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1; // too quiet

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++)
        for (let j = 0; j < SIZE - i; j++)
          c[i] = c[i] + buf[j] * buf[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      let T0 = maxpos;
      return sr / T0;
    }

    selectString(0);
  </script>
</body>
</html>
