<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baritone Uke Academy 🎸</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-success: #22c55e;
      --accent-warn: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --pink: #ec4899;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 2.2rem; color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover { background: var(--accent); color: #000; }
    .btn-audio {
      background: var(--purple);
      color: #fff;
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
    }
    .btn-audio:hover { background: #9333ea; color: #fff; }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .selector-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    select {
      background: #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      font-size: 1rem;
      font-weight: bold;
    }

    /* Target Display & Feedback */
    .target-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid var(--accent);
      transition: all 0.3s;
    }
    .big-note { font-size: 3.8rem; font-weight: bold; color: var(--pink); }
    .note-instruction { font-size: 1.25rem; color: var(--text-main); margin-top: 5px; }
    .score-badge { font-size: 1.2rem; font-weight: bold; color: var(--accent-success); margin-top: 10px; }

    .pulse-success {
      animation: pulse 0.5s ease-out;
      border-color: var(--accent-success) !important;
      box-shadow: 0 0 20px var(--accent-success);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Visual Fretboard */
    .fretboard {
      display: flex;
      flex-direction: column;
      background: #451a03;
      border: 4px solid #78350f;
      border-radius: 8px;
      padding: 10px 0;
      position: relative;
    }
    .string-label {
      position: absolute;
      left: -35px;
      color: var(--accent);
      font-weight: bold;
      font-size: 0.9rem;
    }
    .string-row {
      display: flex;
      height: 36px;
      align-items: center;
      position: relative;
    }
    .string-line {
      position: absolute;
      width: 100%;
      background: #cbd5e1;
      z-index: 1;
    }
    .fret {
      flex: 1;
      height: 100%;
      border-right: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      position: relative;
    }
    .fret-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-success);
      color: #000;
      font-weight: bold;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--accent-success);
    }
    .fret-dot.active { display: flex; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Baritone Uke Academy 🎸</h1>
    <p class="subtitle">Play Rock, Pop, and Games on your D-G-B-E Ukulele!</p>
  </header>

  <nav>
    <button class="btn active" onclick="switchMode('song')">🎵 Song Practice</button>
    <button class="btn" onclick="switchMode('ninja')">🥷 Ninja Song Play-Along</button>
  </nav>

  <div class="container">
    
    <!-- SONG MODE -->
    <div id="song-view">
      <div class="selector-bar">
        <label for="song-select" style="font-weight:bold;">Song & Tier:</label>
        <select id="song-select" onchange="loadSong()">
          <optgroup label="🟢 Easy Tiers">
            <option value="sandman">Enter Sandman - Metallica (Easy)</option>
            <option value="hotcross">Hot Cross Buns (Starter)</option>
          </optgroup>
          <optgroup label="🟡 Medium Tiers">
            <option value="enemy">Enemy - Imagine Dragons (Medium)</option>
            <option value="babyshark">Baby Shark (Fun)</option>
          </optgroup>
          <optgroup label="🔴 Hard Tiers">
            <option value="readyforit">...Ready For It? - Taylor Swift (Hard)</option>
            <option value="twinkle">Twinkle Twinkle Little Star</option>
          </optgroup>
        </select>
        <button id="mic-btn-song" class="btn" onclick="toggleMic()">🎤 Start Mic Listener</button>
      </div>

      <div class="target-card" id="target-card">
        <div class="big-note" id="target-note">D3</div>
        <div class="note-instruction" id="target-inst">Pluck Open 4th String (D)</div>
        <button class="btn btn-audio" onclick="playCurrentTargetNote()">🔊 Listen to Target Note</button>
        <div class="score-badge" id="song-progress">Note 1 of 6</div>
      </div>
    </div>

    <!-- NINJA GAME MODE -->
    <div id="ninja-view" class="hidden">
      <div class="selector-bar">
        <label for="ninja-song-select" style="font-weight:bold;">Choose Song Track:</label>
        <select id="ninja-song-select" onchange="startNinjaSong()">
          <option value="sandman">Enter Sandman - Metallica 🎸</option>
          <option value="enemy">Enemy - Imagine Dragons 🐉</option>
          <option value="readyforit">...Ready For It? - Taylor Swift ⭐</option>
          <option value="random">🔀 Random String Challenge</option>
        </select>
        <button id="mic-btn-ninja" class="btn" onclick="toggleMic()">🎤 Start Game Mic</button>
      </div>
      <div class="target-card" id="ninja-target-card">
        <div class="big-note" id="ninja-target">G3</div>
        <div class="note-instruction" id="ninja-inst">Pluck Open 3rd String (G)</div>
        <button class="btn btn-audio" onclick="playCurrentTargetNote()">🔊 Listen to Target Note</button>
        <div class="score-badge" id="ninja-score">Score: 0 ⭐ | Note 1 of 6</div>
      </div>
    </div>

    <!-- FRETBOARD VISUALIZER GUIDE -->
    <h4 style="margin: 15px 0 8px 0; color: var(--text-muted);">Finger Placement Guide:</h4>
    <div class="fretboard">
      <!-- E4 String -->
      <div class="string-row">
        <span class="string-label">E4</span>
        <div class="string-line" style="height:1px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-3-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-3-3">3</div></div>
      </div>
      <!-- B3 String -->
      <div class="string-row">
        <span class="string-label">B3</span>
        <div class="string-line" style="height:1.5px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-2-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-2-3">3</div></div>
      </div>
      <!-- G3 String -->
      <div class="string-row">
        <span class="string-label">G3</span>
        <div class="string-line" style="height:2px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-1-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-1-3">3</div></div>
      </div>
      <!-- D3 String -->
      <div class="string-row">
        <span class="string-label">D3</span>
        <div class="string-line" style="height:2.5px;"></div>
        <div class="fret"><div class="fret-dot" id="dot-0-0">Open</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-1">1</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-2">2</div></div>
        <div class="fret"><div class="fret-dot" id="dot-0-3">3</div></div>
      </div>
    </div>

  </div>

  <script>
    const SONGS = {
      sandman: [
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'E3', freq: 164.81, stringIdx: 0, fret: 2, inst: '2nd Fret on 4th String (D)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' },
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' }
      ],
      enemy: [
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' },
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' }
      ],
      readyforit: [
        { note: 'E4', freq: 329.63, stringIdx: 3, fret: 0, inst: 'Open 1st String (E)' },
        { note: 'E4', freq: 329.63, stringIdx: 3, fret: 0, inst: 'Open 1st String (E)' },
        { note: 'D4', freq: 293.66, stringIdx: 2, fret: 3, inst: '3rd Fret on 2nd String (B)' },
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' }
      ],
      hotcross: [
        { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Open 2nd String (B)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' }
      ],
      babyshark: [
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'E3', freq: 164.81, stringIdx: 0, fret: 2, inst: '2nd Fret on 4th String (D)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' },
        { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Open 3rd String (G)' }
      ],
      twinkle: [
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Open 4th String (D)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' },
        { note: 'A3', freq: 220.00, stringIdx: 1, fret: 2, inst: '2nd Fret on 3rd String (G)' }
      ]
    };

    let currentMode = 'song';
    let currentSong = [];
    let songStep = 0;
    
    let ninjaSongKey = 'sandman';
    let ninjaStep = 0;
    let ninjaScore = 0;

    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let cooldown = false;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Web Audio Pluck Tone Generator with Feedback Safeguard
    function playPluckTone(freq) {
      initAudioContext();
      
      // Mute microphone listener during sound playback to stop loop feedback
      cooldown = true;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 3, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 0.6);

      gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);

      // Re-enable microphone pitch listener 1.1s later after room reverb subsides
      setTimeout(() => {
        cooldown = false;
      }, 1100);
    }

    function playCurrentTargetNote() {
      let freq = currentMode === 'song' 
        ? currentSong[songStep].freq 
        : (ninjaSongKey === 'random' ? window.ninjaTarget.freq : SONGS[ninjaSongKey][ninjaStep].freq);
      if (freq) playPluckTone(freq);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('nav .btn').forEach((b, i) => b.classList.toggle('active', (i===0 && mode==='song') || (i===1 && mode==='ninja')));
      document.getElementById('song-view').classList.toggle('hidden', mode !== 'song');
      document.getElementById('ninja-view').classList.toggle('hidden', mode !== 'ninja');
      
      if(mode === 'song') loadSong();
      else startNinjaSong();
    }

    function loadSong() {
      const key = document.getElementById('song-select').value;
      currentSong = SONGS[key];
      songStep = 0;
      updateSongUI();
    }

    function updateSongUI() {
      const item = currentSong[songStep];
      document.getElementById('target-note').innerText = item.note;
      document.getElementById('target-inst').innerText = item.inst;
      document.getElementById('song-progress').innerText = `Note ${songStep + 1} of ${currentSong.length}`;
      highlightFret(item.stringIdx, item.fret);
    }

    function startNinjaSong() {
      ninjaSongKey = document.getElementById('ninja-song-select').value;
      ninjaStep = 0;
      updateNinjaUI();
    }

    function updateNinjaUI() {
      if(ninjaSongKey === 'random') {
        const strings = [
          { note: 'D3', freq: 146.83, stringIdx: 0, fret: 0, inst: 'Pluck Open 4th String (D)' },
          { note: 'G3', freq: 196.00, stringIdx: 1, fret: 0, inst: 'Pluck Open 3rd String (G)' },
          { note: 'B3', freq: 246.94, stringIdx: 2, fret: 0, inst: 'Pluck Open 2nd String (B)' },
          { note: 'E4', freq: 329.63, stringIdx: 3, fret: 0, inst: 'Pluck Open 1st String (E)' }
        ];
        const target = strings[Math.floor(Math.random() * strings.length)];
        window.ninjaTarget = target;
        document.getElementById('ninja-target').innerText = target.note;
        document.getElementById('ninja-inst').innerText = target.inst;
        document.getElementById('ninja-score').innerText = `Score: ${ninjaScore} ⭐ | Challenge Mode`;
        highlightFret(target.stringIdx, target.fret);
      } else {
        const track = SONGS[ninjaSongKey];
        const item = track[ninjaStep];
        document.getElementById('ninja-target').innerText = item.note;
        document.getElementById('ninja-inst').innerText = item.inst;
        document.getElementById('ninja-score').innerText = `Score: ${ninjaScore} ⭐ | Note ${ninjaStep + 1} of ${track.length}`;
        highlightFret(item.stringIdx, item.fret);
      }
    }

    function highlightFret(stringIdx, fretIdx) {
      document.querySelectorAll('.fret-dot').forEach(d => d.classList.remove('active'));
      const dot = document.getElementById(`dot-${stringIdx}-${fretIdx}`);
      if(dot) dot.classList.add('active');
    }

    async function toggleMic() {
      initAudioContext();
      if(isListening) return;
      
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      isListening = true;
      document.querySelectorAll('#mic-btn-song, #mic-btn-ninja').forEach(b => b.innerText = "🎤 Listening...");
      listen();
    }

    function listen() {
      if(!isListening) return;
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      
      // Skip processing if microphone is in cooldown (during synthesized sound playback)
      if(!cooldown) {
        const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

        if(pitch !== -1) {
          let targetFreq = 0;
          if(currentMode === 'song') {
            targetFreq = currentSong[songStep].freq;
          } else {
            targetFreq = ninjaSongKey === 'random' ? window.ninjaTarget.freq : SONGS[ninjaSongKey][ninjaStep].freq;
          }
          
          if(Math.abs(pitch - targetFreq) < 6.5) {
            cooldown = true;
            const activeCard = currentMode === 'song' ? document.getElementById('target-card') : document.getElementById('ninja-target-card');
            activeCard.classList.add('pulse-success');
            
            setTimeout(() => {
              activeCard.classList.remove('pulse-success');
              if(currentMode === 'song') {
                songStep = (songStep + 1) % currentSong.length;
                updateSongUI();
              } else {
                ninjaScore += 1;
                if(ninjaSongKey !== 'random') {
                  const track = SONGS[ninjaSongKey];
                  ninjaStep = (ninjaStep + 1) % track.length;
                }
                updateNinjaUI();
              }
              cooldown = false;
            }, 700);
          }
        }
      }
      requestAnimationFrame(listen);
    }

    function autoCorrelate(buf, sr) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.015) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++)
        for (let j = 0; j < SIZE - i; j++)
          c[i] = c[i] + buf[j] * buf[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      return sr / maxpos;
    }

    loadSong();
  </script>
</body>
</html>
